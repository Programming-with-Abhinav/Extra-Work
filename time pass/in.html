<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
        <link rel="stylesheet" href="style.css">
	</head>
	<body>
		<form action="submit_page.html" method="post" class="alignment">
                <h1>From</h1>
                <h2>Basic Information</h2>
				<div class="userName">
                    <p>Name: </p>
					<input type="text" id="userID" placeholder="Enter Your Name" />
				</div>
				<div class="userPhone">
                    <p>Phone Number: </p>
					<input type="tel" id="userNumber" placeholder="Enter Your Number" />
				</div>
				<div class="userBrith">
                    <p>DOB: </p>
					<input type="date" id="userBrith" placeholder="Enter Your DOB" />
				</div>

				<div class="userFather">
                    <p>Father Name</p>
					<input
						type="text"
						id="userFather"
						placeholder="Enter Your Father Name" />
				</div>
				<div class="userMother">
                    <p>Mother Father</p>
					<input
						type="text"
						id="userMother"
						placeholder="Enter Your Mother Name" />
				</div>

                <div class="userFather-contact">
                    <p>Father's Phone</p>
					<input
						type="text"
						id="userFather"
						placeholder="Enter Your Father Phone Number" />
				</div>
		</form>
	</body>
</html>
